name: F1-A verification

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies and generate lockfile
        run: npm install --ignore-scripts

      - name: Typecheck, test and build
        run: npm run check

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: f1-a-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

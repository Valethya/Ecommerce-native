name: F1-A verification

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies and generate lockfile
        run: npm install --ignore-scripts

      - name: Typecheck, test and build
        run: npm run check

      - name: Commit generated lockfile once
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(f1-a): lock dependencies"
          git push origin HEAD:${{ github.head_ref }}
